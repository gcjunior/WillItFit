appId: com.anonymous.willItFit
---
# Compare live Simulator UI against reference PNGs in public/screenshots/.
# Reference images are committed manually — one file per screen name (no auto-capture).
#
#   npm run test:ui:visual
- launchApp
- extendedWaitUntil:
    visible: "Run Demo \\(Mock Data\\)"
    timeout: 30000
- assertScreenshot:
    path: public/screenshots/index.png
    thresholdPercentage: 98
    label: index screen matches reference

- tapOn: "Run Demo \\(Mock Data\\)"
- extendedWaitUntil:
    visible: "Your Moving Plan"
    timeout: 30000
- assertScreenshot:
    path: public/screenshots/summary.png
    thresholdPercentage: 98
    label: summary screen matches reference

- tapOn: "View Packing Tutorial"
- extendedWaitUntil:
    visible: "Packing Tutorial"
    timeout: 30000
- assertScreenshot:
    path: public/screenshots/packing.png
    thresholdPercentage: 90
    label: packing screen matches reference (lower threshold — 3D canvas)
