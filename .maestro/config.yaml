# Maestro workspace config for Will It Fit?
# Install: https://docs.maestro.dev/getting-started/installing-maestro
#
# Local run (iOS Simulator):
#   export EXPO_PUBLIC_USE_MOCK=true
#   npm run ios
#   npm run test:ui              # behavior + screenshot comparison
#   npm run test:ui:baseline     # first-time: capture baseline PNGs
#
# CI: .github/workflows/ios-maestro.yml (macOS runner + iOS Simulator)
#
# appId must match app.json ios.bundleIdentifier / android package.
# Screenshot baselines: .maestro/screenshots/baseline/ (committed to git)
